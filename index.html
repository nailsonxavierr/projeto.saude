<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saúde & Bem-Estar</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#97D085;--gh:#86BF75;--b:#5B8DEF;--bg:#fff;--fld:#F2F2F2;--tx:#111;--sub:#8E8E93;--cream:#FAEFDB;--red:#D95B5B;--blk:#000;--page:#CDC8C7;--sh:0 3px 6px rgba(0,0,0,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181A;--fld:#26282B;--tx:#F2F2F3;--sub:#9A9AA0;--cream:#3A3424;--page:#0C0C0D;--blk:#F2F2F3;--sh:0 3px 6px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#17181A;--fld:#26282B;--tx:#F2F2F3;--sub:#9A9AA0;--cream:#3A3424;--page:#0C0C0D;--blk:#F2F2F3;--sh:0 3px 6px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Poppins,system-ui,sans-serif;background:var(--page);color:var(--tx);display:flex;justify-content:center;align-items:center}
#app{position:relative;width:100%;max-width:390px;height:100%;max-height:800px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:500px){#app{height:min(800px,96%);border-radius:44px;box-shadow:0 25px 60px -15px rgba(0,0,0,.35)}}
#view{flex:1;overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
#view.p0{padding:0}
#view.gr{background:var(--g);color:#fff;justify-content:center;align-items:center;text-align:center}
.hd{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;margin-bottom:18px;min-height:40px}
.hd h2{font-size:17px;font-weight:700;text-align:center;line-height:1.3}
.ib{width:36px;height:36px;border:0;background:none;color:var(--tx);font-size:20px;cursor:pointer;border-radius:50%}
.ib:hover{background:var(--fld)}
.wk{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:16px}
.wk button{border:0;border-radius:12px;padding:7px 0;background:var(--g);color:#fff;font:500 10px Poppins;cursor:pointer;display:flex;flex-direction:column;align-items:center;opacity:.55;box-shadow:0 0 6px var(--g)}
.wk b{font-size:11px;font-weight:600}.wk .on{opacity:1;box-shadow:none}
.sec{font-size:14px;font-weight:600;margin:6px 0 10px}
.band{background:var(--cream);margin:0 -24px;padding:20px 24px;display:flex;flex-direction:column;align-items:center}
.bar{height:5px;background:#fff;border-radius:5px;overflow:hidden;width:160px}
.bar i{display:block;height:100%;background:var(--b);transition:width .3s}
.bar.w{width:100%;background:#fff;height:4px}
.rnd{width:26px;height:26px;border-radius:50%;border:0;background:var(--b);color:#fff;font:700 14px Poppins;cursor:pointer}
.cta{width:100%;padding:12px;border:0;border-radius:10px;background:var(--g);color:#fff;font:500 15px Poppins;cursor:pointer;margin-top:auto}
.cta:hover{background:var(--gh)}.cta:active{transform:scale(.99)}
.cta.s{width:62%;align-self:center;margin-top:26px}
.cta.o{background:var(--bg);color:var(--tx);border:1.5px solid var(--tx)}
.lnk{background:none;border:0;color:var(--tx);font:600 12px Poppins;text-decoration:underline;cursor:pointer;padding:12px;align-self:center}
.fab{width:38px;height:38px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:24px;line-height:1;cursor:pointer;align-self:center;margin-top:auto;flex:none}
.cd{background:var(--bg);border-radius:12px;box-shadow:var(--sh);padding:12px 14px}
.row{display:flex;align-items:center;justify-content:space-between}
.n{font-weight:600;font-size:14px}.t{font-size:11px;color:var(--sub);font-weight:500}
.ic{width:36px;font-size:24px;text-align:center;flex:none}
label.l{display:block;font-size:11px;font-weight:600;margin:14px 0 6px}
.f{width:100%;background:var(--fld);color:var(--tx);border:0;border-radius:10px;padding:12px 14px;font:500 12px Poppins;outline:none;display:block;margin-bottom:12px}
.f:focus{box-shadow:0 0 0 2px var(--g)}.f:disabled{opacity:1;-webkit-text-fill-color:var(--tx)}
select.f{appearance:none}
.pl{display:flex;justify-content:space-between;gap:10px;margin:6px 0 18px}
.pl button{width:48px;height:48px;border-radius:50%;border:2px solid transparent;background:var(--fld);font-size:22px;cursor:pointer}
.pl button.on{border-color:var(--g)}
.meal{display:flex;gap:8px;margin:34px 0 10px}
.meal button{flex:1;border:0;background:none;color:#c5c5c8;font:600 11px Poppins;border-radius:10px;padding:9px 4px;cursor:pointer}
.meal button.on{background:var(--fld);color:var(--tx)}
.sw{position:relative;width:42px;height:22px;border-radius:22px;background:var(--fld);border:0;cursor:pointer;transition:.2s;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.sw.on{background:var(--g)}.sw.on::after{left:23px}.sw.k.on{background:#111}
.sww{position:relative;margin-bottom:10px}
.sww .a{position:absolute;top:0;bottom:0;width:56px;border:0;border-radius:12px;color:#fff;font-size:20px;cursor:pointer}
.sww .a.l{left:0;background:var(--bg);color:var(--tx);box-shadow:var(--sh)}.sww .a.r{right:0;background:var(--red)}
.cm{position:relative;touch-action:pan-y;cursor:grab;user-select:none;transition:transform .2s}
.pill{background:#EEF1F4;border-radius:8px;padding:7px 10px;margin-top:10px;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#222}
.pill span.x{width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;font-size:10px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.pill button{border:0;background:none;color:var(--sub);cursor:pointer}
.tile{border-radius:20px;color:#fff;border:0;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:600 11px Poppins;cursor:pointer;transition:transform .1s}
.tile:active{transform:scale(.97)}
.emo{display:flex;justify-content:space-between;background:var(--cream);border-radius:12px;padding:12px 16px}
.emo button{border:0;background:none;font-size:26px;cursor:pointer;filter:grayscale(1);opacity:.55;transition:.15s}
.emo button.on,.emo.h button{filter:none;opacity:1}
.emo.h button:hover{transform:scale(1.15)}
.gq{font-size:11px;font-weight:600;color:var(--g);margin-bottom:2px}
.trash{background:none;border:0;color:var(--sub);cursor:pointer;font-size:14px}.trash:hover{color:var(--red)}
#toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;background:#fff;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:26px 22px;width:76%;text-align:center}
#toast b{display:block;background:#000;color:#fff;font:500 12px Poppins;padding:11px 8px;border-radius:12px}
#toast.on{opacity:1}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:50;display:none;align-items:center;justify-content:center;padding:28px}
#modal.on{display:flex}
#modal .b{background:#fff;color:#111;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.25);width:100%;text-align:center;overflow:hidden}
#modal p{font-size:12px;padding:30px 12px 22px}
#modal .row button{flex:1;padding:12px;border:0;background:#000;color:#fff;font:500 12px Poppins;cursor:pointer}
#modal .row button+button{border-left:1px solid #555}
#kp{position:absolute;left:0;right:0;bottom:0;z-index:40;background:#D1D3D9;padding:6px 6px 22px;display:none;grid-template-columns:repeat(3,1fr);gap:6px}
#kp.on{display:grid}
#kp button{background:#fff;border:0;border-radius:6px;box-shadow:0 1px 0 #888;padding:8px 0;font:400 20px Poppins;cursor:pointer;color:#111}
#kp small{display:block;font-size:8px;font-weight:700;letter-spacing:1px}
#kp .e{background:none;box-shadow:none}
#sc{position:absolute;inset:0;z-index:30;display:none}#sc.on{display:block}
.pop{animation:pop .22s ease}@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app">
  <div id="view"></div>
  <div id="sc" onclick="kc()"></div>
  <div id="kp"></div>
  <div id="toast"><b id="tm"></b></div>
  <div id="modal"><div class="b"><p id="mq">Remover este registro?</p><div class="row"><button onclick="ans(1)">Sim</button><button onclick="ans(0)">Não</button></div></div></div>
</div>
<script>
const KEY='saude-bem-estar-v2',DIAS=['Dom','Seg','Ter','Qua','Qui','Sex'];
const $=s=>document.querySelector(s),val=id=>$('#'+id).value.trim();
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=s=>{const[a,b,c]=s.split('-');return `${c}/${b}/${a.slice(2)}`};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const br=(n,d=2)=>Number(n).toFixed(d).replace('.',',');
const today=iso(new Date());
function seed(){const t=new Date(),d=n=>{const x=new Date(t);x.setDate(t.getDate()-n);return iso(x)};
return{auth:0,notif:1,goal:2000,cont:500,ctype:'Garrafa',wrem:0,
user:{nome:'Elina Souza',email:'elinasouza@gmail.com',senha:'123456',tel:'',gen:'Feminino',nasc:'2003-07-27',h:1.65},
water:{[today]:1250,[d(1)]:1250,[d(2)]:1250,[d(3)]:2000},
meds:[{id:1,icon:'💊',name:'Omega 3',dose:'1 cápsula',times:['08:00','20:00'],days:180,chk:{}},{id:2,icon:'⚪',name:'Buscopam',dose:'1 comprimido',times:['08:00'],days:7,chk:{}},{id:3,icon:'🧪',name:'Vacinação',dose:'1 ampola',times:['14:00'],days:1,chk:{},missed:1}],
w:[{id:1,d:'2026-06-10',v:84},{id:2,d:'2026-07-20',v:80},{id:3,d:'2026-08-25',v:74},{id:4,d:'2026-09-20',v:74},{id:5,d:'2026-10-01',v:72}],
m:[{id:1,d:d(1),e:'😄',a:'Meu namorado me trouxe flores',b:'Nada',c:'Nada de importante'},{id:2,d:d(2),e:'😄',a:'Fui muito bem na prova hoje',b:'Nada',c:'Com esforço, a gente sempre consegue'}]}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S)S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const dow=new Date().getDay();
let V='splash',SEL=dow>5?iso(new Date(Date.now()-864e5)):today,DW=S.water[SEL]||0,D={},C={},KP=-1,cb=null,tmr;
const FACES=['😄','😊','😐','😩','😠'];
const go=v=>{V=v;render()};
function toast(m){$('#tm').textContent=m;$('#toast').classList.add('on');clearTimeout(toast.k);toast.k=setTimeout(()=>$('#toast').classList.remove('on'),1700)}
function ask(q,f){$('#mq').textContent=q||'Remover este registro?';cb=f;$('#modal').classList.add('on')}
function ans(y){$('#modal').classList.remove('on');if(y&&cb){cb();save();render();toast('Registro removido!')}cb=null}
const hd=(t,b,x,r)=>`<div class="hd">${b?`<button class="ib" onclick="go('${b}')">${x?'✕':'‹'}</button>`:'<span></span>'}<h2>${t}</h2>${r||'<span></span>'}</div>`;
const fl=(l,id,ph,tp='text',v='',ex='')=>`${l?`<label class="l">${l}</label>`:''}<input class="f" id="${id}" type="${tp}" placeholder="${ph}" value="${esc(v)}" ${ex}>`;
const sl=(l,id,ph,opts,v)=>`${l?`<label class="l">${l}</label>`:''}<select class="f" id="${id}"><option value="" ${v?'':'selected'} disabled>${ph}</option>${opts.map(o=>`<option value="${o[0]}" ${o[0]==v?'selected':''}>${o[1]}</option>`).join('')}</select>`;
const LOGO=(s)=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100"><rect width="100" height="100" rx="30" fill="#5B8DEF"/><path d="M50 74 28 52c-6-6-5-16 2-19 6-3 13 0 17 6l3 5z" fill="#F4F4F4"/><rect x="42" y="30" width="22" height="46" rx="11" transform="rotate(32 53 53)" fill="#97D085"/></svg>`;
const ageOf=n=>{const b=new Date(n),t=new Date();let a=t.getFullYear()-b.getFullYear();if(t<new Date(t.getFullYear(),b.getMonth(),b.getDate()))a--;return isNaN(a)?'—':a};
const mask=e=>{const[l,d]=e.split('@');return l.slice(0,3)+'*****'+l.slice(-2)+'@'+d};
const ws=()=>[...S.w].sort((a,b)=>a.d.localeCompare(b.d));
const curW=()=>{const a=ws();return a.length?a[a.length-1].v:null};

/* ---- AUTH ---- */
const vSplash=()=>LOGO(150);
function vLogin(){return `<div style="text-align:center;margin:10px 0 22px">${LOGO(104)}</div>${fl('Email:','le','Digite seu email','email')}${fl('Senha:','lp','Digite sua senha','password')}
<button class="lnk" style="align-self:flex-end;padding:0;font-size:9px;margin:-4px 0 26px" onclick="go('rs1')">Esqueceu a senha?</button>
<button class="cta o" style="margin:0 0 12px;font-size:12px;font-weight:600" onclick="S.auth=1;save();go('home')"><b style="color:#4285F4">G</b><b style="color:#EA4335">o</b><b style="color:#FBBC05">o</b><b style="color:#4285F4">g</b><b style="color:#34A853">l</b><b style="color:#EA4335">e</b> &nbsp;Continuar com o Google</button>
<button class="cta" style="margin:0" onclick="login()">Entrar</button>
<div style="text-align:center;font-size:11px;font-weight:600;margin-top:auto;padding-top:16px">Não possui conta?<br><button class="lnk" style="padding:2px" onclick="C={};go('cad1')">Cadastre-se</button></div>`}
function login(){const e=val('le').toLowerCase(),p=$('#lp').value;if(e===S.user.email.toLowerCase()&&p===S.user.senha){S.auth=1;save();go('home')}else toast('Dados inválidos. Demo: elinasouza@gmail.com / 123456')}
const vCad1=()=>hd('Cadastro','login',1)+fl('','cn','Nome completo','text',C.nome||'')+fl('','ce','Email','email',C.email||'')+fl('','ct','Telefone','tel',C.tel||'')+fl('','cp','Senha','password')+fl('','cq','Confirmar senha','password')+`<button class="cta" onclick="cad1()">Avançar</button>`;
function cad1(){const n=val('cn'),e=val('ce'),p=$('#cp').value;if(!n||!/^\S+@\S+\.\S+$/.test(e)){toast('Informe nome e email válidos');return}if(p.length<4||p!==$('#cq').value){toast('As senhas precisam ser iguais (mín. 4)');return}C={nome:n,email:e,tel:val('ct'),senha:p};go('cad2')}
const vCad2=()=>hd('Complete as informações para concluir seu cadastro','cad1')+sl('','cg','Selecione seu gênero',[['Feminino','Feminino'],['Masculino','Masculino'],['Outro','Outro']],C.gen)+fl('','cb','Data de nascimento','text',C.nasc||'','onfocus="this.type=\'date\'"')+fl('','cw','Peso (kg)','number','','step="0.1" inputmode="decimal"')+fl('','ch','Altura (m)','number','','step="0.01" inputmode="decimal"')+`<button class="cta" onclick="cad2()">Salvar</button>`;
function cad2(){const w=parseFloat($('#cw').value);let h=parseFloat($('#ch').value);if(h>3)h/=100;if(!$('#cg').value||!$('#cb').value||!(w>20&&w<400)||!(h>.5&&h<2.6)){toast('Preencha todos os campos');return}
const u={...C,gen:$('#cg').value,nasc:$('#cb').value,h};S=seed();S.user=u;S.auth=1;S.w=[{id:1,d:today,v:w}];S.meds=[];S.m=[];S.water={};save();go('welcome')}
const vWelcome=()=>`<div style="font-weight:700;font-size:14px;line-height:1.5">Tudo certo por aqui,<br>agora você está pronto para<br>desfrutar do nosso app!</div><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.2"><path d="M4 13l5 5L20 6"/></svg>`;
const vRs1=()=>hd('Redefinir senha','login',1)+`<div style="text-align:center;font-weight:700;font-size:13px;line-height:1.5;margin:26px 0 24px">Você receberá o link para redefinir<br>sua senha no email cadastrado</div>${fl('Email:','re','',  'text',mask(S.user.email),'readonly')}<button class="cta" onclick="toast('Link enviado!');go('rs2')">Confirmar</button>`;
const vRs2=()=>hd('Redefinir senha','')+`<div style="height:20px"></div>${fl('Nova senha:','n1','********','password')}${fl('Confirmar nova senha:','n2','********','password')}<button class="cta" onclick="rs2()">Salvar</button>`;
function rs2(){const a=$('#n1').value;if(a.length<4||a!==$('#n2').value){toast('As senhas precisam ser iguais (mín. 4)');return}S.user.senha=a;save();go('rsok')}
const vRsok=()=>`<div style="font-weight:700;font-size:14px;line-height:1.5">Senha redefinida<br>com sucesso!</div><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.2"><path d="M4 13l5 5L20 6"/></svg>`;

/* ---- HOME / PERFIL / CONTA ---- */
const IC={
med:`<svg width="58" height="58" viewBox="0 0 48 48"><g transform="rotate(-40 24 24)"><rect x="4" y="13" width="40" height="22" rx="11" fill="#fff"/><path d="M24 13v22" stroke="var(--tc)" stroke-width="3"/></g><circle cx="35" cy="35" r="8" fill="#fff" stroke="var(--tc)" stroke-width="2"/><path d="M30 40l10-10" stroke="var(--tc)" stroke-width="2"/></svg>`,
peso:`<svg width="58" height="58" viewBox="0 0 48 48"><rect x="4" y="4" width="40" height="40" rx="7" fill="#fff"/><path d="M12 22a12 12 0 0 1 24 0z" fill="none" stroke="var(--tc)" stroke-width="3.5"/><path d="M24 22l5-7" stroke="var(--tc)" stroke-width="3"/></svg>`,
agua:`<svg width="58" height="58" viewBox="0 0 48 48"><path d="M24 3c9 10 15 16 15 25a15 15 0 0 1-30 0C9 19 15 13 24 3z" fill="#fff"/><path d="M17 31a8 8 0 0 0 7 7" fill="none" stroke="var(--tc)" stroke-width="3" stroke-linecap="round"/></svg>`,
fit:`<svg width="64" height="58" viewBox="0 0 54 48"><g fill="#fff"><rect x="2" y="16" width="7" height="16" rx="2"/><rect x="9" y="11" width="7" height="26" rx="2"/><rect x="38" y="11" width="7" height="26" rx="2"/><rect x="45" y="16" width="7" height="16" rx="2"/><rect x="16" y="22" width="22" height="4"/></g></svg>`};
function vHome(){const tl=(c,i,l,f)=>`<button class="tile" style="background:var(--${c});--tc:var(--${c})" onclick="${f}">${IC[i]}${l}</button>`;
return `<div style="background:var(--g);padding:18px 24px 12px;display:flex;align-items:center;gap:10px;color:#fff;font-weight:600;font-size:14px;border-radius:0 0 4px 4px"><button onclick="go('perfil')" style="width:36px;height:36px;border-radius:50%;border:2px solid #fff;background:#DDE9D7;color:#5a7a4d;font:700 15px Poppins;cursor:pointer">${esc(S.user.nome[0])}</button>Olá, ${esc(S.user.nome.split(' ')[0])}</div>
<div style="padding:22px 24px"><div class="sec" style="margin-top:0">Como foi o seu dia?</div><div class="emo h" style="margin-bottom:22px">${FACES.map(e=>`<button onclick="D={e:'${e}'};go('humor')">${e}</button>`).join('')}</div>
<div class="sec">Minhas atividades</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">${tl('g','med','Medicamentos',"go('meds')")}${tl('b','peso','Peso',"go('peso')")}${tl('b','agua','Água',"DW=S.water[SEL]||0;go('agua')")}${tl('g','fit','Atividade física',"toast('Atividade física em breve!')")}</div></div>`}
function vPerfil(){const u=S.user,w=curW(),st=(a,b)=>`<div class="cd" style="flex:1;text-align:center;padding:10px 4px"><div style="font-size:11px;font-weight:600">${a}</div><div style="font-size:9px;color:var(--sub)">${b}</div></div>`;
return hd('Perfil','home')+`<div style="text-align:center"><div style="width:76px;height:76px;border-radius:50%;margin:0 auto 10px;background:#DDE9D7;border:3px solid #cfe3f3;color:#5a7a4d;font:700 30px/70px Poppins">${esc(u.nome[0])}</div><div class="n">${esc(u.nome)}</div><button onclick="D.edit=1;go('conta')" style="margin-top:8px;border:0;background:var(--blk);color:var(--bg);font:500 9px Poppins;padding:5px 12px;border-radius:12px;cursor:pointer">Editar perfil</button></div>
<div class="row" style="gap:12px;margin:22px 0 20px">${st(br(u.h)+' m','Altura')}${st(w?String(w).replace('.',',')+'kg':'—','Peso')}${st(ageOf(u.nasc),'Idade')}</div>
<button class="cd" style="width:100%;text-align:left;border:0;cursor:pointer;color:var(--tx);margin-bottom:14px" onclick="D.edit=0;go('conta')"><div class="n" style="font-size:12px;margin-bottom:8px">Conta</div><div class="row"><span class="t" style="color:var(--tx)">🗒 &nbsp;Dados Pessoais</span><span>›</span></div></button>
<div class="cd"><div class="n" style="font-size:12px;margin-bottom:8px">Notificação</div><div class="row"><span class="t" style="color:var(--tx)">🔔 &nbsp;Notificações</span><button class="sw k ${S.notif?'on':''}" onclick="S.notif=S.notif?0:1;save();this.classList.toggle('on')"></button></div></div>
<button class="lnk" style="margin-top:auto;color:var(--red)" onclick="S.auth=0;save();go('login')">Sair da conta</button>`}
function vConta(){const u=S.user,e=!D.edit,r=e?'disabled':'';
return hd('Conta','perfil')+fl('Nome:','un','','text',u.nome,r)+fl('Email:','ue','','email',u.email,r)+fl('Senha:','us','','password',u.senha,r)+fl('Data de nascimento:','ud','','date',u.nasc,r)+(D.edit?`<button class="cta" onclick="svConta()">Salvar</button>`:'')}
function svConta(){if(!val('un')||!/^\S+@\S+\.\S+$/.test(val('ue'))||$('#us').value.length<4){toast('Verifique os campos');return}Object.assign(S.user,{nome:val('un'),email:val('ue'),senha:$('#us').value,nasc:val('ud')||S.user.nasc});save();toast('Dados atualizados!');D.edit=0;go('perfil')}

/* ---- ÁGUA ---- */
function wk(f){let h='<div class="wk">';const s=new Date();s.setDate(s.getDate()-s.getDay());for(let i=0;i<6;i++){const x=new Date(s);x.setDate(s.getDate()+i);const k=iso(x);h+=`<button class="${k===SEL?'on':''}" onclick="${f}('${k}')"><span>${DIAS[i]}</span><b>${x.getDate()}</b></button>`}return h+'</div>'}
const pd=k=>{SEL=k;DW=S.water[k]||0;render()},pm=k=>{SEL=k;render()};
const G=()=>br(S.goal/1000,1).replace(',0','');
function vAgua(){const pct=Math.min(100,Math.round(DW/S.goal*100)),y=22-pct/100*19.3,P='M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z';
return hd('Água','home',0,`<button class="ib" onclick="go('agua_cfg')" style="font-size:17px">⚙</button>`)+wk('pd')+`<div class="sec">Consumo de ${SEL===today?'hoje':fmt(SEL)}</div>
<div class="band"><div style="font-weight:600;font-size:12px;margin-bottom:6px">${br(DW/1000)} / ${G()} L</div><div class="bar" style="margin-bottom:16px"><i style="width:${pct}%"></i></div>
<div class="row" style="gap:28px"><button class="rnd" onclick="wd(-1)">−</button><svg width="70" height="80" viewBox="0 0 24 24"><defs><clipPath id="c"><path d="${P}"/></clipPath></defs><rect clip-path="url(#c)" y="${y}" width="24" height="24" fill="#5B8DEF" style="transition:y .4s"/><path d="${P}" fill="none" stroke="#5B8DEF" stroke-width="1"/></svg><button class="rnd" onclick="wd(1)">+</button></div><div class="t" style="margin-top:8px">${pct}% • cada toque = ${S.cont} ml</div></div>
<button class="lnk" style="margin-top:auto" onclick="go('agua_hist')">Ver histórico de consumo</button><button class="cta" style="margin-top:0" onclick="S.water[SEL]=DW;save();toast('Consumo de água registrado com sucesso!')">Registrar</button>`}
const wd=s=>{DW=Math.max(0,Math.min(S.goal*2,DW+s*S.cont));render()};
function vAguaCfg(){const o=(a,f)=>a.map(x=>[x,f(x)]);
return hd('Configurações de ingestão de água','agua',1)+`<div style="height:14px"></div>`+sl('Meta de consumo de água','cg','Selecionar',o([1500,2000,2500,3000],x=>br(x/1000,1).replace(',0','')+' L'),S.goal)+sl('Volume do recipiente','cc','Selecionar',o([200,300,500],x=>x+' ml'),S.cont)+sl('Tipo do recipiente','ct','Selecionar',o(['Garrafa','Copo','Squeeze'],x=>x),S.ctype)
+`<div class="row" style="margin:14px 0"><span class="n" style="font-size:11px">Ativar lembrete</span><button class="sw ${S.wrem?'on':''}" onclick="S.wrem=S.wrem?0:1;this.classList.toggle('on')"></button></div><button class="cta" onclick="svCfg()">Salvar</button>`}
function svCfg(){if(!$('#cg').value||!$('#cc').value||!$('#ct').value){toast('Selecione todas as opções');return}S.goal=+$('#cg').value;S.cont=+$('#cc').value;S.ctype=$('#ct').value;save();DW=S.water[SEL]||0;toast('Configurações salvas!');go('agua')}
const vAguaHist=()=>hd('Histórico de consumo','agua')+Object.keys(S.water).sort().reverse().map(k=>`<div style="font-size:12px;font-weight:500;margin:0 0 6px">${fmt(k)}</div><div class="cd" style="text-align:center;margin-bottom:18px;padding:10px 24px 12px"><div style="font-size:12px;font-weight:600;margin-bottom:6px">${br(S.water[k]/1000)} / ${G()} L</div><div class="bar w" style="background:var(--fld)"><i style="width:${Math.min(100,S.water[k]/S.goal*100)}%"></i></div></div>`).join('');

/* ---- MEDICAMENTOS ---- */
const lab=d=>d>=30?Math.round(d/30)+(d>=45?' meses':' mês'):d+(d>1?' dias':' dia');
function vMeds(){const sl={};S.meds.forEach(m=>m.times.forEach(t=>(sl[t]=sl[t]||[]).push(m)));
const h=Object.keys(sl).sort().map(t=>`<div style="font-size:12px;font-weight:600;margin:10px 0 8px">${t.replace(/^0/,'')}</div>`+sl[t].map(m=>{const on=m.chk[SEL+'|'+t];
return `<div class="sww pop"><button class="a l" onclick="chkMed(${m.id},'${t}')">✓</button><button class="a r" onclick="delMed(${m.id})">✕</button>
<div class="cd cm" ${on?'style="outline:2px solid var(--g)"':''}><div class="row"><div class="row" style="gap:10px"><span class="ic">${m.icon}</span><div><div class="n">${esc(m.name)}</div><div class="t">${m.times.length}x ao dia</div></div></div><div class="t" style="text-align:right">${on?'<b style="color:var(--g);font-size:15px">✓</b><br>':''}${lab(m.days)}</div></div>
${m.missed&&!on?`<div class="pill"><span class="x" style="margin-right:-2px">!</span><span style="flex:1">Você não foi à ${m.name==='Vacinação'?'vacinação':'dose'}</span><button onclick="medById(${m.id}).missed=0;save();render()">✕</button></div>`:''}</div></div>`}).join('')).join('');
return hd('Medicamentos','home')+wk('pm')+(h||'<p class="t" style="text-align:center;margin-top:40px">Nenhum medicamento agendado.</p>')+(h?'<div class="t" style="text-align:center;margin-top:6px">Arraste o card: ← remover • → confirmar</div>':'')+`<button class="fab" onclick="D={icon:'💊',name:'',dose:'',meal:2,t:[''],rem:0,min:20,days:7};go('add1')">+</button>`}
const medById=id=>S.meds.find(m=>m.id===id);
function chkMed(id,t){const m=medById(id),k=SEL+'|'+t;m.chk[k]=!m.chk[k];save();render();if(m.chk[k])toast('Dose confirmada!')}
const delMed=id=>ask('Remover este registro?',()=>{S.meds=S.meds.filter(m=>m.id!==id)});
function sv(){if($('#dn')){D.name=val('dn');D.dose=val('dd')}}
const vAdd1=()=>hd('','meds')+`<div class="t" style="margin:-8px 0 2px">1 de 2</div><div class="n" style="font-size:15px;margin-bottom:18px">Adicionar Medicamento</div><div class="pl">${['⚪','💊','🧪','🫁'].map(i=>`<button class="${D.icon===i?'on':''}" onclick="sv();D.icon='${i}';render()">${i}</button>`).join('')}</div>
${fl('Nome','dn','Escrever','text',D.name)}${fl('Dose','dd','Escrever','text',D.dose)}<div class="meal">${['Esquecer','Antes das refeições','Depois das refeições'].map((x,i)=>`<button class="${D.meal===i?'on':''}" onclick="sv();D.meal=${i};render()">${x}</button>`).join('')}</div><button class="cta" onclick="sv();if(!D.name){toast('Informe o nome');return}go('add2')">Próximo</button>`;
const tf=b=>b.length?b.padStart(4,'0').replace(/(..)(..)/,'$1:$2'):'00:00';
function vAdd2(){return hd('','add1')+`<div class="t" style="margin:-8px 0 2px">2 de 2</div><div class="n" style="font-size:15px;margin-bottom:18px">Agendar</div>
<div class="row" style="border-left:3px solid var(--fld);padding:2px 0 2px 14px;margin-bottom:22px"><div class="row" style="gap:10px"><span style="font-size:30px">${D.icon}</span><div><div class="n">${esc(D.name)}</div><div class="t">${esc(D.dose||'1 dose')}</div></div></div><button class="t" style="border:0;background:none;cursor:pointer;align-self:flex-end;font-family:Poppins" onclick="const o=[1,7,14,30,90];D.days=o[(o.indexOf(D.days)+1)%5];render()">${lab(D.days)} ⟳</button></div>
${D.t.map((b,i)=>`<div class="row" style="margin-bottom:10px"><span class="n">Dose ${i+1}</span><span class="row" style="gap:8px">${D.t.length>1?`<button class="trash" onclick="D.t.splice(${i},1);render()">✕</button>`:''}<button onclick="ko(${i})" style="border:0;background:none;cursor:pointer;font:700 14px Poppins;color:${b?'var(--tx)':'#c5c5c8'}">${tf(b)}</button></span></div>`).join('')}
<button class="ib" style="background:#EEF1F4;margin:6px 0 22px;width:34px;height:34px;font-size:18px" onclick="D.t.push('');render()">+</button>
<div class="row"><span class="n" style="font-size:11px">Ativar lembrete</span><button class="sw ${D.rem?'on':''}" onclick="D.rem=D.rem?0:1;render()"></button></div>
${D.rem?`<div class="row" style="margin:20px 6px 0">${[5,10,15,20,30].map(m=>`<button onclick="D.min=${m};render()" style="border:0;background:none;cursor:pointer;font:700 12px Poppins;color:${D.min===m?'var(--tx)':'#c5c5c8'}">${m} m</button>`).join('')}</div>`:''}
<button class="cta" onclick="addMed()">Salvar</button>`}
function addMed(){if(D.t.some(b=>b.length<4)){toast('Defina o horário de cada dose');return}save();S.meds.push({id:Date.now(),icon:D.icon,name:D.name,dose:D.dose||'1 dose',times:[...new Set(D.t.map(tf))].sort(),days:D.days,chk:{}});save();toast('Medicamento agendado!');go('meds')}
/* keypad */
$('#kp').innerHTML=[1,2,3,4,5,6,7,8,9].map((n,i)=>`<button onclick="kd(${n})">${n}<small>${['','ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ'][i]}</small></button>`).join('')+`<span></span><button onclick="kd(0)">0</button><button class="e" onclick="kd('b')">⌫</button>`;
function ko(i){KP=i;D.t[i]='';$('#kp').classList.add('on');$('#sc').classList.add('on');render()}
function kc(){KP=-1;$('#kp').classList.remove('on');$('#sc').classList.remove('on');render()}
function kd(n){let b=D.t[KP];if(n==='b')b=b.slice(0,-1);else if(b.length<4)b+=n;D.t[KP]=b;
if(b.length===4){const h=+b.slice(0,2),m=+b.slice(2);if(h>23||m>59){toast('Horário inválido');D.t[KP]='';render();return}kc();return}render()}

/* swipe */
let SWP=null;
document.addEventListener('pointerdown',e=>{const c=e.target.closest('.cm');if(!c)return;SWP={c,x:e.clientX,b:+c.dataset.o||0,o:null};c.style.transition='none';try{c.setPointerCapture(e.pointerId)}catch(_){}});
document.addEventListener('pointermove',e=>{if(!SWP)return;const o=Math.max(-60,Math.min(60,SWP.b+e.clientX-SWP.x));SWP.o=o;SWP.c.style.transform=`translateX(${o}px)`});
document.addEventListener('pointerup',()=>{if(!SWP)return;const c=SWP.c,o=SWP.o===null?SWP.b:SWP.o,f=o>30?60:o<-30?-60:0;c.style.transition='transform .2s';c.style.transform=`translateX(${f}px)`;c.dataset.o=f;SWP=null});

/* ---- PESO ---- */
const cat=b=>b<18.5?['Abaixo do peso','#4a5bd6']:b<25?['Peso ideal','#4cb34c']:b<30?['Sobrepeso','#f08a24']:['Obesidade I','#e5372e'];
function vPeso(){const a=ws(),h=S.user.h;if(!a.length)return hd('Peso','home')+`<p class="t" style="text-align:center;margin:60px 0">Nenhum registro ainda.</p><button class="fab" onclick="go('peso_add')">+</button>`;
const c=a[a.length-1].v,p=a[a.length-2],imc=c/(h*h),[cn,cc]=cat(imc),dp=c-a[0].v,dc=p?c-p.v:0;
const pos=imc<18.5?Math.max(2,(imc-14)/4.5*25):imc<25?25+(imc-18.5)/6.5*25:imc<30?50+(imc-25)/5*25:Math.min(98,75+(imc-30)/10*25);
const vs=a.map(x=>x.v),mn=Math.min(...vs)-4,mx=Math.max(...vs)+3,W=300,pts=a.map((x,i)=>[a.length>1?14+i*(W-28)/(a.length-1):W/2,110-(x.v-mn)/(mx-mn)*80]);
const ln=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
const st=(v,l,dir)=>`<div style="flex:1;text-align:center"><div style="font-weight:700;font-size:15px">${v>0?'+':''}${br(v)}<small style="font-size:9px">Kg</small></div><div style="font-size:9px;font-weight:600;color:${v<0?'#4cb34c':v>0?'#e5372e':'var(--sub)'}">${v<0?'⌄':v>0?'⌃':'•'} ${l}</div></div>`;
return hd('Peso','home')+`<div style="text-align:center;margin-bottom:14px"><div style="font-size:30px;font-weight:700">${br(c)}<small style="font-size:16px">Kg</small></div><div style="font-size:10px;font-weight:600">IMC ${br(imc,1).replace(',','.')} <span style="color:${cc}">${cn.replace('Obesidade I','Obesidade')}</span></div></div>
<div class="band row" style="flex-direction:row;padding:14px 24px">${st(dp,'Progresso')}<i style="width:1px;align-self:stretch;background:rgba(0,0,0,.12)"></i>${st(dc,p?'Comparado com ('+fmt(p.d).replace(/\//g,'/')+')':'Sem comparação')}</div>
<svg viewBox="0 0 300 130" style="margin:12px -24px 0;width:calc(100% + 48px)"><path d="${ln} L ${pts[pts.length-1][0]} 130 L ${pts[0][0]} 130Z" fill="#D2E8FB"/><path d="${ln}" fill="none" stroke="#2f8cf0" stroke-width="1.6" stroke-linejoin="round"/>${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="2.8" fill="#fff" stroke="#2f8cf0" stroke-width="1.4"/><text x="${q[0]}" y="${q[1]-8}" text-anchor="middle" font-size="8" fill="var(--tx)" font-family="Poppins">${br(a[i].v,0)}</text>`).join('')}</svg>
<div class="band" style="align-items:stretch;padding:14px 24px;margin-top:-6px"><div style="font-weight:700;font-size:12px;margin-bottom:8px">Peso ideal ${br(21*h*h)} Kg</div>
<div style="position:relative"><div style="display:flex;height:3px"><i style="flex:1;background:#2b2bd6"></i><i style="flex:1;background:#4cd04c"></i><i style="flex:1;background:#f5a04a"></i><i style="flex:1;background:#e5372e"></i></div><i style="position:absolute;top:-4px;left:calc(${pos}% - 5px);width:10px;height:10px;border-radius:50%;background:#fff;border:1.5px solid #f5a04a;transition:left .4s"></i></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:3px 30px;margin:12px auto 0;font-size:7px;font-weight:700"><span><b style="color:#2b2bd6">●</b> Abaixo do peso</span><span><b style="color:#f5a04a">●</b> Sobrepeso</span><span><b style="color:#4cd04c">●</b> Peso ideal</span><span><b style="color:#e5372e">●</b> Obesidade I</span></div></div>
<div style="font-size:9px;line-height:1.55;margin-top:10px"><b style="font-size:11px">Peso</b><br>O peso refere-se ao peso do corpo de uma pessoa. Pode conhecer seu estado de saúde com base nas alterações de peso. Se perdeu ou ganhou muito peso em um curto período de tempo, é necessária uma análise mais aprofundada.</div>
<button class="fab" onclick="go('peso_add')">+</button>`}
const vPesoAdd=()=>hd('Insira seu novo peso','peso')+`<div style="height:24px"></div><div class="row" style="background:var(--fld);border-radius:10px;padding-left:14px"><span style="font-size:18px">⚖</span><input id="nw" type="number" step="0.1" inputmode="decimal" placeholder="Peso" style="flex:1;background:none;border:0;outline:none;padding:13px 10px;font:500 13px Poppins;color:var(--tx);min-width:0"><span style="background:#000;color:#fff;font:600 13px Poppins;padding:13px 14px;border-radius:10px">Kg</span></div>
<button class="cta s" onclick="addW()">Salvar</button><button class="lnk" style="margin-top:auto" onclick="go('peso_hist')">Visualizar histórico de peso</button>`;
function addW(){const v=parseFloat($('#nw').value);if(!(v>20&&v<400)){toast('Informe um peso válido');return}const e=S.w.find(x=>x.d===today);e?e.v=v:S.w.push({id:Date.now(),d:today,v});save();toast('Peso registrado!');go('peso')}
const vPesoHist=()=>hd('Histórico de pesos','peso')+ws().reverse().map(x=>`<div style="font-size:12px;margin-bottom:6px">${fmt(x.d)}</div><div class="cd row" style="background:var(--fld);margin-bottom:18px;padding:10px 14px"><span style="font-size:12px">⚖ &nbsp;${br(x.v)} Kg</span><button class="trash" onclick="ask(0,()=>{S.w=S.w.filter(q=>q.id!==${x.id})})">🗑</button></div>`).join('');

/* ---- HUMOR ---- */
const mv=()=>{if($('#ma')){D.a=val('ma');D.b=val('mb');D.c=val('mc')}};
const vHumor=()=>hd('Humor','home')+`<div class="n" style="margin-bottom:12px;font-size:14px">Como foi seu dia?</div><div class="emo">${FACES.map(e=>`<button class="${D.e===e?'on':''}" onclick="mv();D.e='${e}';render()">${e}</button>`).join('')}</div>
${fl('O que te fez bem?','ma','Escrever','text',D.a||'')}${fl('O que te fez mal?','mb','Escrever','text',D.b||'')}${fl('O que você aprendeu hoje?','mc','Escrever','text',D.c||'')}
<button class="cta s" style="margin-top:8px" onclick="mv();S.m.push({id:Date.now(),d:today,e:D.e||'😄',a:D.a||'',b:D.b||'',c:D.c||''});save();D={};toast('Humor registrado!');go('humor_hist')">Salvar</button><button class="lnk" style="margin-top:auto" onclick="mv();go('humor_hist')">Visualizar histórico de humor</button>`;
const q=(t,v)=>`<div style="margin-bottom:10px"><div class="gq">${t}</div><div style="font-size:11px;font-weight:500">${v?esc(v):'-'}</div></div>`;
const vHumorHist=()=>hd('Histórico de humor','humor')+([...S.m].sort((x,y)=>y.d.localeCompare(x.d)||y.id-x.id).map(m=>`<div class="row" style="justify-content:flex-start;gap:8px;font-size:11px;font-weight:600;margin-bottom:6px"><span style="font-size:17px">${m.e}</span>• ${fmt(m.d)}</div><div class="cd pop" style="background:var(--fld);position:relative;margin-bottom:16px;padding:14px"><button class="trash" style="position:absolute;right:12px;top:10px" onclick="ask(0,()=>{S.m=S.m.filter(z=>z.id!==${m.id})})">🗑</button>${q('O que te fez bem?',m.a)}${q('O que te fez mal?',m.b)}${m.c?q('O que você aprendeu hoje?',m.c).replace('margin-bottom:10px','margin-bottom:0'):''}</div>`).join('')||'<p class="t" style="text-align:center;margin-top:50px">Nenhum registro ainda.</p>');

/* ---- RENDER ---- */
const VIEWS={splash:vSplash,login:vLogin,cad1:vCad1,cad2:vCad2,welcome:vWelcome,rs1:vRs1,rs2:vRs2,rsok:vRsok,home:vHome,perfil:vPerfil,conta:vConta,agua:vAgua,agua_cfg:vAguaCfg,agua_hist:vAguaHist,meds:vMeds,add1:vAdd1,add2:vAdd2,peso:vPeso,peso_add:vPesoAdd,peso_hist:vPesoHist,humor:vHumor,humor_hist:vHumorHist};
function render(){const v=$('#view'),y=v.scrollTop,keep=document.activeElement&&document.activeElement.id;
if(!S.auth&&!['splash','login','cad1','cad2','welcome','rs1','rs2','rsok'].includes(V))V='login';
v.className=['splash','welcome','rsok'].includes(V)?'gr':V==='home'?'p0':'';
v.innerHTML=VIEWS[V]();v.scrollTop=y;clearTimeout(tmr);
if(V==='splash')tmr=setTimeout(()=>go(S.auth?'home':'login'),1800);
if(V==='welcome')tmr=setTimeout(()=>go('home'),2400);
if(V==='rsok')tmr=setTimeout(()=>go('login'),2200)}
render();
</script>
